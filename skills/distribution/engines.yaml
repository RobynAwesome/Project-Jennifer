version: 1
project: Project Jennifer
orchestration_engine: free-mode
source_of_truth:
  - ../cag-communication-attention/SKILL.md
  - ../rag-governed-retrieval/SKILL.md
  - ../jennifer-stateless-renter/SKILL.md

rules:
  preserve_skill_semantics: true
  preserve_yaml_metadata: true
  require_exact_runtime_id: true
  verify_provider_support_at_runtime: true
  private_cross_lane_default: deny_without_explicit_authorization
  memory_self_promotion: prohibited
  training_promotion: human_validation_required
  return_receipts: true

engines:
  - id: openai-codex
    family: OpenAI
    delivery: skill-md-direct
    skills: [cag-communication-attention, rag-governed-retrieval, jennifer-stateless-renter]
    notes:
      - OpenAI publicly documents reusable Skills/SKILL.md workflows; still validate the exact runtime surface before deployment.

  - id: openai-chatgpt
    family: OpenAI
    delivery: skill-md-direct
    skills: [cag-communication-attention, rag-governed-retrieval, jennifer-stateless-renter]
    notes:
      - Use workspace/product permissions as an external tool boundary.

  - id: antigravity
    family: stateless-renter
    delivery: repository-context-adapter
    skills: [cag-communication-attention, rag-governed-retrieval, jennifer-stateless-renter]
    notes:
      - Resolve exact runtime/provider identity in its capability manifest.

  - id: kiro
    family: stateless-renter
    delivery: repository-context-adapter
    skills: [cag-communication-attention, rag-governed-retrieval, jennifer-stateless-renter]

  - id: cursor
    family: stateless-renter
    delivery: repository-context-adapter
    skills: [cag-communication-attention, rag-governed-retrieval, jennifer-stateless-renter]

  - id: github-copilot
    family: stateless-renter
    delivery: repository-context-adapter
    skills: [cag-communication-attention, rag-governed-retrieval, jennifer-stateless-renter]

  - id: kimi
    family: stateless-renter
    delivery: context-adapter
    skills: [cag-communication-attention, rag-governed-retrieval, jennifer-stateless-renter]

  - id: google-gemini
    family: Google
    delivery: context-adapter
    skills: [cag-communication-attention, rag-governed-retrieval, jennifer-stateless-renter]
    notes:
      - Do not hard-code Gemini generation numbers as permanent capability truth; benchmark exact model IDs.

  - id: google-notebook
    family: Google
    delivery: source-grounding-adapter
    skills: [cag-communication-attention, rag-governed-retrieval]
    notes:
      - Treat notebook/source collections as evidence sources, not constitutional authority by default.

  - id: perplexity
    family: stateless-renter
    delivery: retrieval-adapter
    skills: [cag-communication-attention, rag-governed-retrieval, jennifer-stateless-renter]

  - id: ollama
    family: local-open-model-runtime
    delivery: local-agent-adapter
    skills: [cag-communication-attention, rag-governed-retrieval, jennifer-stateless-renter]
    notes:
      - Preferred lane for offline-capable renters when the selected model satisfies task requirements.

  - id: hugging-face
    family: open-model-ecosystem
    delivery: inference-or-agent-adapter
    skills: [cag-communication-attention, rag-governed-retrieval, jennifer-stateless-renter]

  - id: microsoft-azure-ai
    family: Microsoft
    delivery: cloud-agent-adapter
    skills: [cag-communication-attention, rag-governed-retrieval, jennifer-stateless-renter]

  - id: kc
    family: project-jennifer-native
    delivery: native-project-contract
    skills: [cag-communication-attention, rag-governed-retrieval, jennifer-stateless-renter]

  - id: rtcp
    family: project-jennifer-native
    delivery: native-project-contract
    skills: [cag-communication-attention, rag-governed-retrieval, jennifer-stateless-renter]
    notes:
      - Each Roundtable Council Protocol agent still declares its own exact capability manifest.
