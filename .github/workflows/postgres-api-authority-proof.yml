name: PostgreSQL API Authority Proof

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/api/**"
      - "packages/runtime/**"
      - "packages/shared/**"
      - "infra/postgres/**"
      - "tools/prove-postgres-api-authority.mjs"
      - "tools/prove-postgres-api-recovery.mjs"
      - ".github/workflows/postgres-api-authority-proof.yml"
      - "pnpm-lock.yaml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/api/**"
      - "packages/runtime/**"
      - "packages/shared/**"
      - "infra/postgres/**"
      - "tools/prove-postgres-api-authority.mjs"
      - "tools/prove-postgres-api-recovery.mjs"
      - ".github/workflows/postgres-api-authority-proof.yml"
      - "pnpm-lock.yaml"

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.4.0"
  DATABASE_URL: "postgresql://jennifer:jennifer_ci@127.0.0.1:5432/project_jennifer_api_ci"

jobs:
  api-authority-proof:
    name: API PostgreSQL authority + outage/recovery proof
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: project_jennifer_api_ci
          POSTGRES_USER: jennifer
          POSTGRES_PASSWORD: jennifer_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jennifer -d project_jennifer_api_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API dependency graph
        run: pnpm --filter @jennifer/api... build

      - name: Prove API authority, restart, idempotency, and fail-closed startup
        run: node tools/prove-postgres-api-authority.mjs

      - name: Prove live database outage, degradation, recovery, and telemetry
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: node tools/prove-postgres-api-recovery.mjs
