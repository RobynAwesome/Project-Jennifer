name: AwesomeSkills Submit Once

on:
  push:
    branches:
      - forge/awesome-skills-submit

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright in ephemeral directory
        shell: bash
        run: |
          mkdir -p /tmp/awesome-skills-submit
          cd /tmp/awesome-skills-submit
          npm init -y >/dev/null 2>&1
          npm install playwright@latest
          npx playwright install chromium

      - name: Inspect validation, submit Project Jennifer, and verify publication
        shell: bash
        env:
          PROJECT_URL: https://github.com/RobynAwesome/Project-Jennifer
          SUBMIT_URL: https://www.awesomeskills.dev/en/submit
          EXPECTED_URL: https://www.awesomeskills.dev/en/skill/robynawesome-project-jennifer
        run: |
          cd /tmp/awesome-skills-submit
          node <<'NODE'
          const { chromium } = require('playwright');

          const projectUrl = process.env.PROJECT_URL;
          const submitUrl = process.env.SUBMIT_URL;
          const expectedUrl = process.env.EXPECTED_URL;

          async function snapshot(page, label) {
            console.log(`\n===== ${label} =====`);
            const inputs = await page.locator('input').evaluateAll((els) => els.map((el, index) => ({
              index,
              type: el.type,
              name: el.name,
              value: el.value,
              placeholder: el.placeholder,
              required: el.required,
              checked: el.checked,
              disabled: el.disabled,
              ariaInvalid: el.getAttribute('aria-invalid'),
              className: el.className,
            })));
            const buttons = await page.locator('button').evaluateAll((els) => els.map((el, index) => ({
              index,
              text: el.textContent?.trim(),
              type: el.type,
              disabled: el.disabled,
              ariaDisabled: el.getAttribute('aria-disabled'),
            })));
            const iframes = await page.locator('iframe').evaluateAll((els) => els.map((el, index) => ({
              index,
              title: el.title,
              src: el.src,
              name: el.name,
            })));
            console.log('INPUTS', JSON.stringify(inputs, null, 2));
            console.log('BUTTONS', JSON.stringify(buttons, null, 2));
            console.log('IFRAMES', JSON.stringify(iframes, null, 2));
            console.log('BODY', (await page.locator('body').innerText()).slice(0, 12000));
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              locale: 'en-US',
              viewport: { width: 1440, height: 1000 },
              userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
            });
            const page = await context.newPage();

            page.on('console', (msg) => {
              const text = msg.text();
              if (!text.includes('font-size:0;color:transparent')) console.log(`BROWSER[${msg.type()}] ${text}`);
            });
            page.on('pageerror', (err) => console.log(`PAGEERROR ${err.message}`));
            page.on('response', (response) => {
              const url = response.url();
              const request = response.request();
              if (request.method() !== 'GET' || response.status() >= 400 || url.includes('/api/')) {
                console.log(`NETWORK ${response.status()} ${request.method()} ${url}`);
              }
            });

            try {
              console.log(`Opening ${submitUrl}`);
              const navigation = await page.goto(submitUrl, { waitUntil: 'domcontentloaded', timeout: 60000 });
              console.log(`Initial HTTP status: ${navigation?.status()}`);
              await page.waitForTimeout(6000);
              await snapshot(page, 'INITIAL FORM STATE');

              const githubInput = page.getByPlaceholder(/github\.com\/owner\/repo/i).first();
              if (!(await githubInput.count())) throw new Error('Expected GitHub URL input was not found.');

              console.log(`Filling ${projectUrl}`);
              await githubInput.click();
              await githubInput.fill(projectUrl);
              await githubInput.press('Tab');
              await page.waitForTimeout(10000);
              await snapshot(page, 'AFTER URL VALIDATION');

              const submit = page.getByRole('button', { name: /submit skill/i }).first();
              console.log(`Submit enabled: ${await submit.isEnabled()}`);

              if (!(await submit.isEnabled())) {
                const turnstileFrames = page.frames().filter((frame) => frame.url().includes('challenges.cloudflare.com'));
                console.log(`Cloudflare challenge frame count: ${turnstileFrames.length}`);
                throw new Error('AwesomeSkills Submit Skill is still disabled. Diagnostics above identify whether URL validation or Cloudflare human verification is the remaining prerequisite.');
              }

              console.log('Submit enabled. Clicking.');
              await submit.click();
              await page.waitForTimeout(8000);
              console.log(`Post-submit URL: ${page.url()}`);
              console.log(`Post-submit body: ${(await page.locator('body').innerText()).slice(0, 12000)}`);

              console.log(`Verifying ${expectedUrl}`);
              const verifyResponse = await page.goto(expectedUrl, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(3000);
              const status = verifyResponse?.status() ?? 0;
              const body = await page.locator('body').innerText();
              console.log(`Verification HTTP status: ${status}`);
              console.log(`Verification final URL: ${page.url()}`);
              console.log(`Verification body: ${body.slice(0, 12000)}`);

              const normalized = body.toLowerCase();
              if (status < 200 || status >= 400) throw new Error(`Verification returned HTTP ${status}`);
              if (!normalized.includes('project-jennifer') && !normalized.includes('project jennifer')) throw new Error('Project Jennifer identity not found on directory page.');
              if (!normalized.includes('robynawesome')) throw new Error('RobynAwesome source identity not found on directory page.');

              console.log('AWESOMESKILLS_PUBLICATION_RECEIPT=PASS');
              console.log(`AWESOMESKILLS_PUBLIC_URL=${page.url()}`);
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
