name: AwesomeSkills Submit Once

on:
  push:
    branches:
      - forge/awesome-skills-submit

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        shell: bash
        run: |
          mkdir -p /tmp/awesome-skills-submit
          cd /tmp/awesome-skills-submit
          npm init -y >/dev/null 2>&1
          npm install playwright@latest
          npx playwright install chromium

      - name: Submit Project Jennifer or receipt the human-verification gate
        shell: bash
        env:
          PROJECT_URL: https://github.com/RobynAwesome/Project-Jennifer
          SUBMIT_URL: https://www.awesomeskills.dev/en/submit
          EXPECTED_URL: https://www.awesomeskills.dev/en/skill/robynawesome-project-jennifer
        run: |
          cd /tmp/awesome-skills-submit
          node <<'NODE'
          const { chromium } = require('playwright');

          const projectUrl = process.env.PROJECT_URL;
          const submitUrl = process.env.SUBMIT_URL;
          const expectedUrl = process.env.EXPECTED_URL;

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ locale: 'en-US', viewport: { width: 1440, height: 1000 } });
            const page = await context.newPage();

            try {
              const response = await page.goto(submitUrl, { waitUntil: 'domcontentloaded', timeout: 60000 });
              console.log(`SUBMIT_PAGE_HTTP=${response?.status()}`);
              await page.waitForTimeout(4000);

              const input = page.getByPlaceholder(/github\.com\/owner\/repo/i).first();
              await input.fill(projectUrl);
              await input.press('Tab');
              console.log(`PROJECT_URL_FILLED=${await input.inputValue()}`);
              await page.waitForTimeout(4000);

              // Decline the unrelated optional newsletter offer if it appears.
              const declineMarketing = page.getByRole('button', { name: /No thanks/i });
              if (await declineMarketing.count()) {
                console.log('OPTIONAL_NEWSLETTER_MODAL=present');
                await declineMarketing.first().click();
                console.log('OPTIONAL_NEWSLETTER=declined');
                await page.waitForTimeout(3000);
              } else {
                console.log('OPTIONAL_NEWSLETTER_MODAL=absent');
              }

              const token = page.locator('input[name="cf-turnstile-response"]');
              const tokenValue = await token.count() ? await token.first().inputValue() : '';
              console.log(`TURNSTILE_TOKEN_LENGTH=${tokenValue.length}`);

              const challengeFrames = page.frames().filter((frame) => frame.url().includes('challenges.cloudflare.com'));
              console.log(`TURNSTILE_FRAME_COUNT=${challengeFrames.length}`);
              for (let i = 0; i < challengeFrames.length; i += 1) {
                const frame = challengeFrames[i];
                console.log(`TURNSTILE_FRAME_${i}_URL=${frame.url()}`);
                try {
                  const text = (await frame.locator('body').innerText()).trim().replace(/\s+/g, ' ').slice(0, 3000);
                  console.log(`TURNSTILE_FRAME_${i}_TEXT=${text}`);
                  const checkboxes = await frame.getByRole('checkbox').count();
                  console.log(`TURNSTILE_FRAME_${i}_CHECKBOXES=${checkboxes}`);
                } catch (error) {
                  console.log(`TURNSTILE_FRAME_${i}_INSPECTION_ERROR=${error.message}`);
                }
              }

              const submit = page.getByRole('button', { name: /submit skill/i }).first();
              const enabled = await submit.isEnabled();
              console.log(`SUBMIT_ENABLED=${enabled}`);

              if (!enabled) {
                if (!tokenValue && challengeFrames.length > 0) {
                  console.log('AWESOMESKILLS_PUBLICATION_GATE=HUMAN_TURNSTILE_REQUIRED');
                  throw new Error('AwesomeSkills requires a Cloudflare Turnstile human-verification token before submission. The repository URL is valid, the optional newsletter was declined, and no automated bypass was attempted.');
                }
                throw new Error('Submit remains disabled for an unresolved non-Turnstile reason.');
              }

              await submit.click();
              await page.waitForTimeout(7000);
              console.log(`POST_SUBMIT_URL=${page.url()}`);
              console.log(`POST_SUBMIT_TEXT=${(await page.locator('body').innerText()).slice(0, 6000)}`);

              const verifyResponse = await page.goto(expectedUrl, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(2500);
              const status = verifyResponse?.status() ?? 0;
              const body = await page.locator('body').innerText();
              const normalized = body.toLowerCase();
              console.log(`PUBLIC_PAGE_HTTP=${status}`);
              console.log(`PUBLIC_PAGE_URL=${page.url()}`);

              if (status < 200 || status >= 400 || !normalized.includes('project jennifer') || !normalized.includes('robynawesome')) {
                throw new Error('Submission action completed but the expected live directory receipt could not be verified.');
              }

              console.log('AWESOMESKILLS_PUBLICATION_RECEIPT=PASS');
              console.log(`AWESOMESKILLS_PUBLIC_URL=${page.url()}`);
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
