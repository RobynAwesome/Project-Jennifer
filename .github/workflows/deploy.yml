name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_web:
        description: "Deploy web to Vercel when secrets are configured"
        type: boolean
        default: false

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.4.0"

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Hosted play URL: enable via workflow_dispatch deploy_web=true once
      # VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID exist.
      # See docs/HOSTING.md and docs/playtesting/LOVE_LOOP_PLAYTEST.md.
      - name: Deploy Web
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_web }}
        working-directory: apps/web
        run: npx vercel --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_JENNIFER_API_URL: ${{ vars.NEXT_PUBLIC_JENNIFER_API_URL }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jennifer-build-${{ github.sha }}
          path: |
            apps/api/dist
            apps/web/.next
          retention-days: 7

      - name: Love-loop hosting reminder
        run: |
          echo "Jennifer City love loop entry: /game"
          echo "Playtest protocol: docs/playtesting/LOVE_LOOP_PLAYTEST.md"
          echo "Hosting notes: docs/HOSTING.md"
