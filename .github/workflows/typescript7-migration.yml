name: TypeScript 7 Migration Gate

on:
  push:
    branches:
      - forge/awesome-skills-typescript7

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: forge/awesome-skills-typescript7
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Rewrite workspace TypeScript dependencies
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const files = ['package.json'];
          for (const root of ['apps', 'packages']) {
            if (!fs.existsSync(root)) continue;
            for (const name of fs.readdirSync(root)) {
              const file = path.join(root, name, 'package.json');
              if (fs.existsSync(file)) files.push(file);
            }
          }

          let changed = 0;
          for (const file of files) {
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (!pkg.devDependencies?.typescript) continue;

            pkg.devDependencies['@typescript/native'] = 'npm:typescript@^7.0.2';
            pkg.devDependencies.typescript = 'npm:@typescript/typescript6@^6.0.2';
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
            changed += 1;
          }

          console.log(`Updated ${changed} package manifests for the TypeScript 7 + TypeScript 6 API compatibility lane.`);
          if (changed < 10) {
            throw new Error(`Expected a workspace-wide migration, only updated ${changed} manifests.`);
          }
          NODE

      - name: Regenerate pnpm lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Verify native TypeScript 7 compiler
        shell: bash
        run: |
          VERSION="$(pnpm exec tsc --version)"
          echo "$VERSION"
          echo "$VERSION" | grep -Eq '^Version 7\.0\.'
          pnpm --filter @jennifer/validation exec tsc --version | grep -Eq '^Version 7\.0\.'

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Governance validation
        run: pnpm governance-validation

      - name: Commit validated migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/*/package.json packages/*/package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "chore: migrate TypeScript toolchain to 7"
          git push origin HEAD:forge/awesome-skills-typescript7
