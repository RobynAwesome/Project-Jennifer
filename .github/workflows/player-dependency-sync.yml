name: Adaptive Player Dependency Sync

on:
  push:
    branches: [forge/adaptive-player-pwa-2026-08-17]
    paths:
      - ".github/workflows/player-dependency-sync.yml"

permissions:
  contents: write

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.4.0"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forge/adaptive-player-pwa-2026-08-17
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add governed player dependencies
        run: |
          pnpm --filter @jennifer/web add three@0.185.1
          pnpm --filter @jennifer/web add --save-dev @types/three@0.185.3
      - name: Commit dependency receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(web): add Three.js player dependencies"
          git push origin HEAD:forge/adaptive-player-pwa-2026-08-17
