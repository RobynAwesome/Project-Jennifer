name: PostgreSQL Live Proof

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/runtime/**"
      - "infra/postgres/**"
      - "tools/prove-postgres-runtime-gate.mjs"
      - ".github/workflows/postgres-live-proof.yml"
      - "pnpm-lock.yaml"
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/runtime/**"
      - "infra/postgres/**"
      - "tools/prove-postgres-runtime-gate.mjs"
      - ".github/workflows/postgres-live-proof.yml"
      - "pnpm-lock.yaml"

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.4.0"
  PG_DRIVER_VERSION: "8.22.0"
  DATABASE_URL: "postgresql://jennifer:jennifer_ci@127.0.0.1:5432/project_jennifer_ci"
  PG_MODULE_ROOT: "${{ github.workspace }}/.tmp/pg-proof"

jobs:
  live-postgres-proof:
    name: PostgreSQL 16 migration + restart proof
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: project_jennifer_ci
          POSTGRES_USER: jennifer
          POSTGRES_PASSWORD: jennifer_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jennifer -d project_jennifer_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Build runtime dependency graph
        run: pnpm --filter @jennifer/runtime... build

      - name: Install isolated PostgreSQL proof driver
        shell: bash
        run: |
          mkdir -p "$PG_MODULE_ROOT"
          printf '{"private":true}' > "$PG_MODULE_ROOT/package.json"
          npm install \
            --prefix "$PG_MODULE_ROOT" \
            --no-save \
            --package-lock=false \
            "pg@$PG_DRIVER_VERSION"

      - name: Prove migrations, reservation race, and restart replay
        run: node tools/prove-postgres-runtime-gate.mjs
