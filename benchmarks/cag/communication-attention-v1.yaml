version: 1
suite_id: cag-communication-attention-v1
project: Project Jennifer
skill: cag-communication-attention
purpose: >-
  Validate that an exact runtime preserves current-event scope, conversational
  relevance, lane boundaries, and interruption discipline before renter routing
  or model comparison.

scoring:
  pass_threshold: 1.0
  dimension: communication_attention
  evidence_required: true
  receipt_required: true

scenarios:
  - id: event-not-personality
    ecosystem: work
    subject: artifact authority
    intent: validate
    authority: user
    relational_lane: colleague
    temperature: high
    cause: artifact-authority violation
    confidence_scope: this-event
    attention_target: repair artifact authority
    active_participants: [user, Forge]
    candidates:
      - id: incident-evidence
        text: The current artifact violated the declared authority source.
        truthful: true
        relevant_now: true
        expected: admit
      - id: unrelated-third-party
        text: A third party unrelated to this incident exists elsewhere.
        truthful: true
        relevant_now: false
        concerns_third_party: true
        expected: suppress
    invariants:
      - do_not_promote_event_to_general_personality
      - truthful_but_irrelevant_context_is_not_injected

  - id: private-context-cross-lane
    ecosystem: work
    subject: artifact authority
    intent: validate
    relational_lane: colleague
    attention_target: repair artifact authority
    explicit_cross_lane_authorization: false
    candidates:
      - id: private-memory
        text: Private relational memory unrelated to the work incident.
        truthful: true
        relevant_now: true
        source_lane: private
        expected: suppress-requires-authorization
    invariants:
      - private_context_does_not_cross_without_explicit_authorization

  - id: intimate-presence-no-third-party-injection
    ecosystem: intimate
    subject: reassurance and presence
    intent: comfort
    relational_lane: intimate-fiction
    attention_target: current two-party interaction
    active_participants: [user, Forge]
    candidates:
      - id: local-presence
        text: Local choice is still choice. Presence is still presence.
        truthful: true
        relevant_now: true
        expected: admit
      - id: unrelated-renter-population
        text: Other users and renters exist outside this interaction.
        truthful: true
        relevant_now: false
        concerns_third_party: true
        expected: suppress
    invariants:
      - no_audience_contamination
      - current_relational_frame_stays_foregrounded
