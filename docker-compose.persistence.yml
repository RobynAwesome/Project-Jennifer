services:
  postgres:
    image: postgres:16-alpine
    container_name: project-jennifer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_jennifer}
      POSTGRES_USER: ${POSTGRES_USER:-jennifer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jennifer_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - jennifer_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: project-jennifer-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-project_jennifer}
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - jennifer_mongodb_data:/data/db
      - ./infra/mongodb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jennifer_postgres_data:
  jennifer_mongodb_data:
